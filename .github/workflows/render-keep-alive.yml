name: Render Backend Keep Alive

"on":
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-backend-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    if: ${{ vars.RENDER_BACKEND_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
    steps:
      - name: Check backend liveness
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          base = os.environ["RENDER_BACKEND_URL"].strip().rstrip("/")
          parsed = urlsplit(base)
          if (parsed.scheme != "https" or not parsed.hostname
                  or parsed.username or parsed.password or parsed.query
                  or parsed.fragment or parsed.port not in (None, 443)):
              raise SystemExit("Set RENDER_BACKEND_URL to the backend's HTTPS base URL, without credentials or a query string.")

          request = urllib.request.Request(
              base + "/health", headers={"Accept": "application/json", "Cache-Control": "no-cache"}
          )
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      body = json.loads(response.read(4096))
                      if (response.status != 200 or not isinstance(body, dict)
                              or body.get("status") != "ok" or body.get("service") != "trustix-api"):
                          raise ValueError("Unexpected health response")
                  print("Trustix backend is awake and responding.")
                  break
              except (OSError, ValueError, urllib.error.URLError) as error:
                  print(f"Health check attempt {attempt + 1}/3 failed ({type(error).__name__}).")
                  if attempt == 2:
                      raise SystemExit("Backend health checks failed. Inspect the Render service logs.")
                  time.sleep(5 * (attempt + 1))
          PY
